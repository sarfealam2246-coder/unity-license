name: Acquire Unity Activation File
on: workflow_dispatch
jobs:
  activation:
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.20f1-base-3
    steps:
      - name: Create Manual Activation File
        run: |
          unity-editor -quit -batchmode -nographics -createManualActivationFile -logFile /tmp/unity.log || true
          ls -la *.alf
      - name: Upload License Request File
        uses: actions/upload-artifact@v4
        with:
          name: ActivationFile
          path: "*.alf"
          
